<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWLR AI Chatbot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }

        .chat-header {
            background-color: #24292e;
            /* GitHub dark theme color */
            color: white;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-bubble {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #0366d6;
            /* GitHub blue */
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #374151;
            border-bottom-left-radius: 0.25rem;
        }

        .chat-input-area {
            display: flex;
            padding: 1rem;
            border-top: 1px solid #e5e7eb;
            gap: 0.75rem;
        }

        .chat-input {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #0366d6;
            box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.2);
        }

        .send-button {
            background-color: #0366d6;
            /* GitHub blue */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .send-button:hover {
            background-color: #005cc5;
        }

        .send-button:active {
            transform: scale(0.98);
        }

        .send-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .loading-indicator {
            display: none;
            align-self: flex-start;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .loading-indicator.active {
            display: block;
        }

        .error-message {
            color: #ef4444;
            text-align: center;
            padding: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="chat-container">
        <div class="chat-header">
            DWLR AI Chatbot
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Chat messages will be appended here -->
            <div class="message-bubble bot-message">Hello!👋 How can I help you today?😊</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" class="chat-input" placeholder="Type your message...">
            <button id="send-button" class="send-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                    <path
                        d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.917H3.75a.75.75 0 0 0 0 1.5h1.918l-2.432 7.917a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z" />
                </svg>
                Send
            </button>
        </div>
        <div id="loading-indicator" class="loading-indicator px-4 pb-2">Thinking...</div>
        <div id="error-display" class="error-message"></div>
    </div>

    <script type="module">
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorDisplay = document.getElementById('error-display');

        function appendMessage(message, sender) {
            const messageDiv = document.createElement('div');

            messageDiv.classList.add('message-bubble');

            if (sender === 'user') {
                messageDiv.classList.add('user-message');
            } else {
                messageDiv.classList.add('bot-message');
            }

            messageDiv.textContent = message;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();

            if (!message) {
                return;
            }

            appendMessage(message, 'user');

            userInput.value = '';
            sendButton.disabled = true;
            loadingIndicator.classList.add('active');
            errorDisplay.textContent = '';

            try {
                const response = await fetch('http://localhost:5000/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || `Server error: ${response.status}`
                    );
                }

                appendMessage(data.reply, 'bot');

            } catch (error) {
                console.error('AI Error:', error);

                errorDisplay.textContent =
                    'Unable to connect to the AI server.';

                appendMessage(
                    "Sorry, I'm having trouble responding right now.",
                    'bot'
                );

            } finally {
                sendButton.disabled = false;
                loadingIndicator.classList.remove('active');
                userInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);

        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        window.addEventListener('load', () => {
            userInput.focus();
        });

    </script>
</body>

</html>
